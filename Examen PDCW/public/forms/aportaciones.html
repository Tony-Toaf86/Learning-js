<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Aportaciones</title>
	<link rel="stylesheet" href="../css/forms.css">
</head>
<body>
	<main class="contenido-principal">
		<h1>Gestion de Aportaciones</h1>
	</main>

	<div class="container">
		<form id="aportacionForm">
			<input type="hidden" id="id_aportacion" name="id_aportacion">

			<div class="form-group">
				<label for="id_socio">Socio:</label>
				<select id="id_socio" name="id_socio" required>
					<option value="">Seleccione un socio</option>
				</select>
			</div>

			<div class="form-group">
				<label for="monto">Monto:</label>
				<input type="number" id="monto" name="monto" min="0.01" step="0.01" required>
			</div>

			<div class="form-group">
				<label for="tipo_aportacion">Tipo de aportacion:</label>
				<select id="tipo_aportacion" name="tipo_aportacion" required>
					<option value="">Seleccione un tipo</option>
					<option value="mensual">Mensual</option>
					<option value="extraordinaria">Extraordinaria</option>
				</select>
			</div>

			<div class="form-group">
				<label for="fecha_aportacion">Fecha de aportacion:</label>
				<input type="date" id="fecha_aportacion" name="fecha_aportacion" required>
			</div>

			<div class="form-actions">
				<button type="button" class="btn-insertar">Insertar</button>
				<button type="button" class="btn-actualizar">Actualizar</button>
				<button type="button" class="btn-eliminar">Eliminar</button>
				<button type="button" class="btn-listar">Listar</button>
			</div>
		</form>

		<div id="resultado"></div>
	</div>

	<script src="../js/aportaciones.js"></script>
</body>
</html>
