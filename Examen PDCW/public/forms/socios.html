<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Socios</title>
	<link rel="stylesheet" href="../css/forms.css">
</head>
<body>
	<main class="contenido-principal">
		<h1>Gestion de Socios</h1>
	</main>

	<div class="container">
		<form id="socioForm">
			<input type="hidden" id="id_socio" name="id_socio">

			<div class="form-group">
				<label for="nombre_completo">Nombre completo:</label>
				<input type="text" id="nombre_completo" name="nombre_completo" required maxlength="150">
			</div>

			<div class="form-group">
				<label for="direccion">Direccion:</label>
				<textarea id="direccion" name="direccion" placeholder="Ingrese la direccion del socio"></textarea>
			</div>

			<div class="form-group">
				<label for="telefono">Telefono:</label>
				<input type="text" id="telefono" name="telefono" maxlength="20" placeholder="Ej. 0999999999">
			</div>

			<div class="form-group">
				<label for="fecha_ingreso">Fecha de ingreso:</label>
				<input type="date" id="fecha_ingreso" name="fecha_ingreso">
			</div>

			<div class="form-actions">
				<button type="button" class="btn-insertar">Insertar</button>
				<button type="button" class="btn-actualizar">Actualizar</button>
				<button type="button" class="btn-eliminar">Eliminar</button>
				<button type="button" class="btn-listar">Listar</button>
			</div>
		</form>

		<div id="resultado"></div>
	</div>

	<script src="../js/socios.js"></script>
</body>
</html>
